source = colors.conf

################
### MONITORS ###
################

monitor = , highres, auto, auto


#################
### AUTOSTART ###
#################

exec-once = uwsm app -- awww-daemon
exec-once = uwsm app -- mako
exec-once = uwsm app -- wl-clip-persist -c regular


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24

env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_QPA_PLATFORM, wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_QPA_PLATFORMTHEME, qt6ct

env = ELECTRON_OZONE_PLATFORM_HINT, wayland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8

    col.active_border = $primary
    col.inactive_border = $surface_container
}

decoration {
    shadow {
        enabled = false
    }

    blur {
        size = 4
        passes = 2
    }
}

animations {
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = border, 1, 4.68, easeOutQuint
    animation = windows, 1, 3.81, easeOutQuint, popin 87%
    animation = windowsIn, 1, 3.3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fade, 1, 3.03, quick
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.39, almostLinear
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.01, almostLinear
    animation = layers, 1, 3.61, easeOutQuint
    animation = layersIn, 1, 3.3, easeOutQuint, fade
    animation = layersOut, 1, 1.49, linear, fade
    animation = workspaces, 1, 3.32, easeOutQuint, slide
    animation = specialWorkspace, 1, 1.64, almostLinear, fade
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = latam
    sensitivity = -0.2

    touchpad {
        natural_scroll = true
    }
}

device {
    name = logitech-usb-optical-mouse
    sensitivity = -0.7
}


###################
### KEYBINDINGS ###
###################

bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen
bind = SUPER, W, togglesplit
bind = SUPER, P, pin
bind = SUPER, SPACE, togglefloating
bind = SUPER, ESCAPE, exec, ~/.local/bin/rofi-powermenu

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER, TAB, workspace, prev

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, S, togglespecialworkspace
bind = SUPER SHIFT, S, movetoworkspace, special

bind = SUPER, D, exec, ~/.local/bin/rofi-launcher
bind = SUPER, T, exec, ~/.local/bin/rofi-wallpaper
bind = SUPER, PERIOD, exec, ~/.local/bin/rofi-emoji
bind = SUPER SHIFT, PERIOD, exec, ~/.local/bin/rofi-nerdy
bind = SUPER, RETURN, exec, alacritty
bind = SUPER SHIFT, RETURN, exec, alacritty --class Alacritty-float
bind = SUPER, E, exec, nautilus --new-window
bind = SUPER, B, exec, librewolf
bind = SUPER, C, exec, hyprpicker -a -l -d

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n set 5%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPause, exec, playerctl play-pause

bind = , PRINT, exec, ~/.local/bin/rofi-screenshot --instant
bind = SUPER, PRINT, exec, ~/.local/bin/rofi-screenshot


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = match:class .*, idle_inhibit fullscreen

windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on
windowrule = match:xwayland true, match:float true, no_blur on

windowrule = match:class steam, float on
windowrule = match:class steam, match:title Steam, tile on

windowrule = match:title File Upload, float on
windowrule = match:title Open .*, float on
windowrule = match:title Save .*, float on
windowrule = match:title Select .*, float on
windowrule = match:class xdg-desktop-portal-gtk, float on

windowrule = match:class nwg-look, float on
windowrule = match:class qt6ct, float on
windowrule = match:class kvantummanager, float on
windowrule = match:class org\.pulseaudio\.pavucontrol, float on
windowrule = match:class nm-connection-editor, float on
windowrule = match:class ristretto, float on
windowrule = match:class com\.github\.rafostar\.Clapper, float on
windowrule = match:class org\.gnome\.Calculator, float on
windowrule = match:class org\.gnome\.FileRoller, float on
windowrule = match:class Alacritty-float, float on

layerrule = match:namespace waybar, blur on, ignore_alpha 0
layerrule = match:namespace rofi, blur on, ignore_alpha 0

layerrule = match:namespace selection, no_anim on
