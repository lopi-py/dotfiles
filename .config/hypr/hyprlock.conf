source = colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    path = $image
    blur_passes = 3
}

label {
    text = $TIME
    color = $on_surface
    font_family = $font
    font_size = 90

    position = 0, 150
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y" # 1 min
    color = $on_surface
    font_family = $font
    font_size = 25

    position = 0, 50
    halign = center
    valign = center
}

input-field {
    size = 20%, 5%
    outline_thickness = 1

    outer_color = $surface_container_highest
    inner_color = $surface_container
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary

    font_color = $outline
    font_family = $font

    fade_on_empty = false
    rounding = 12

    position = 0, -75
    halign = center
    valign = center
}
