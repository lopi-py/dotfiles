[mgr]
cwd = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
preview_hovered = { bg = "{{colors.on_primary.default.hex}}" }

find_keyword = { fg = "{{colors.error.default.hex | auto_lightness: 10.0}}", bold = true, italic = true }
find_position = { fg = "{{colors.error.default.hex | auto_lightness: 10.0}}", bold = true }

