border_style = { fg = "{{colors.surface_variant.default.hex}}" }

[tabs]
active = { fg = "{{colors.primary.default.hex}}", bg = "reset", bold = true }
inactive = { fg = "{{colors.surface_variant.default.hex}}", bg = "reset" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }
unset_main = { bg = "{{colors.tertiary.default.hex}}", fg = "{{colors.on_tertiary.default.hex}}", bold = true }
unset_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "{{colors.primary.default.hex}}" }
perm_read = { fg = "{{colors.primary_container.default.hex}}" }
perm_write = { fg = "{{colors.on_tertiary_fixed_variant.default.hex}}" }
perm_exec = { fg = "{{colors.error.default.hex | auto_lightness: 15.0}}" }
perm_sep = { fg = "{{colors.surface_variant.default.hex}}" }
progress_label = { bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_bright.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_bright.default.hex}}" }

[which]
mask = { bg = "{{colors.surface_container.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
# TODO: is it really used?
# rest = { fg = "{{colors.on_primary.default.hex}}" }
desc = { fg = "{{colors.on_surface.default.hex}}" }
separator_style = { fg = "{{colors.surface_variant.default.hex}}" }

[confirm]
title = { fg = "{{colors.primary.default.hex}}" }
border = { fg = "{{colors.surface_variant.default.hex}}" }
btn_yes = { fg = "{{colors.primary.default.hex}}" }
btn_no = { fg = "{{colors.error.default.hex | auto_lightness: 15.0}}" }

[spot]
title = { fg = "{{colors.primary.default.hex}}" }
border = { fg = "{{colors.surface_variant.default.hex}}" }
tbl_col = { fg = "{{colors.surface_variant.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[notify]
title_info = { fg = "{{colors.tertiary.default.hex}}" }
title_warn = { fg = "{{colors.primary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
# title = NOT AVAILABLE
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}" }
inactive = { fg = "{{colors.surface_variant.default.hex}}" }

[input]
title = { fg = "{{colors.primary.default.hex}}" }
border = { fg = "{{colors.surface_variant.default.hex}}" }

