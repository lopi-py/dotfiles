[config]

[templates.hyprland]
input_path = "templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.waybar]
input_path = "templates/colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.wlogout]
input_path = "templates/colors.css"
output_path = "~/.config/wlogout/colors.css"

[templates.alacritty]
input_path = "templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.mako]
input_path = "templates/mako-colors"
output_path = "~/.config/mako/colors"
post_hook = "makoctl reload"

[templates.rofi]
input_path = "templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.yazi]
input_path = "templates/yazi-colors.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.cava]
input_path = "templates/cava-colors.ini"
output_path = "~/.config/cava/config"
post_hook = "pkill -USR1 cava"

[templates.lazygit]
input_path = "templates/lazygit-colors.yml"
output_path = "~/.config/lazygit/config.yml"
