[config]

[templates.hyprland]
input_path = "templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.waybar]
input_path = "templates/colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -USR2 waybar"

[templates.rofi]
input_path = "templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.alacritty]
input_path = "templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.foot]
input_path = "templates/foot-colors.ini"
output_path = "~/.config/foot/colors.ini"

[templates.tmux]
input_path = "templates/tmux-colors.conf"
output_path = "~/.tmux/colors.conf"
post_hook = "tmux source-file ~/.tmux/colors.conf"

[templates.gtk3]
input_path = "templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.mako]
input_path = "templates/mako-colors"
output_path = "~/.config/mako/colors"
post_hook = "makoctl reload"

[templates.pywalfox]
input_path = "templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[templates.yazi]
input_path = "templates/yazi-colors.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.lazygit]
input_path = "templates/lazygit-colors.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.cava]
input_path = "templates/cava-colors.ini"
output_path = "~/.config/cava/config"
post_hook = "pkill -USR1 cava"
